<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 World Cup Brand Tracker · Wave 1 — Voice of the Trade</title>
<style>
@font-face{font-family:"Rework Headline";src:url("fonts/ReworkHeadlineTRIAL-Bold.otf") format("opentype");font-weight:700;font-display:swap;}
@font-face{font-family:"Rework Headline";src:url("fonts/ReworkHeadlineTRIAL-Semibold.otf") format("opentype");font-weight:600;font-display:swap;}
@font-face{font-family:"Rework Text";src:url("fonts/ReworkTextTRIAL-Regular.otf") format("opentype");font-weight:400;font-display:swap;}
@font-face{font-family:"Rework Text";src:url("fonts/ReworkTextTRIAL-Semibold.otf") format("opentype");font-weight:600;font-display:swap;}

:root{
  --pitch-dark:#0e3320;
  --chalk:#f1f4ec;
  --magenta:#d6006c;
  --cream:#f7e6c8;
  --card-edge:rgba(241,244,236,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Rework Text","Archivo","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--pitch-dark);color:var(--chalk);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- tab bar ---------- */
.tabbar{
  flex:none;display:flex;align-items:stretch;gap:0;
  background:rgba(8,32,20,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--card-edge);
  padding:0 16px;min-height:58px;
}
.brand{
  display:flex;align-items:center;gap:10px;padding:0 22px 0 4px;margin-right:6px;
  border-right:1px solid var(--card-edge);flex:none;
}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--magenta);box-shadow:0 0 12px var(--magenta)}
.brand .wm{
  font-family:"Rework Headline","Archivo Black",system-ui,sans-serif;font-weight:700;
  font-size:13px;letter-spacing:.04em;line-height:1.05;text-transform:uppercase;
}
.brand .wm span{display:block;font-family:inherit;font-weight:400;font-size:9.5px;
  letter-spacing:.22em;color:var(--cream);opacity:.85;margin-top:2px}

.tabs{display:flex;align-items:stretch;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:none;color:var(--chalk);cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:8px 20px;white-space:nowrap;position:relative;
  font-family:inherit;text-align:left;transition:background .15s;
  border-bottom:3px solid transparent;
}
.tab:hover{background:rgba(255,255,255,.05)}
.tab .t-title{font-weight:600;font-size:14px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.tab .t-sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);opacity:.7}
.tab .pip{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.tab[aria-selected="true"]{border-bottom-color:var(--magenta);background:rgba(214,0,108,.12)}
.tab[aria-selected="true"] .t-title{color:#fff}
.tab[aria-selected="true"] .pip{background:var(--magenta);opacity:1;box-shadow:0 0 10px var(--magenta)}
.tab:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}

/* ---------- panels ---------- */
.stage{flex:1;position:relative;background:var(--pitch-dark)}
.panel{position:absolute;inset:0;display:none}
.panel.active{display:block}
.panel iframe{width:100%;height:100%;border:0;display:block;background:var(--pitch-dark)}
.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--cream);font-size:13px;letter-spacing:.16em;text-transform:uppercase;gap:12px;
}
.loader .dot{width:9px;height:9px;border-radius:50%;background:var(--magenta);
  box-shadow:0 0 12px var(--magenta);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

@media (max-width:680px){
  .brand .wm span{display:none}
  .tab .t-sub{display:none}
  .tab{padding:10px 16px}
}
</style>
</head>
<body>

<nav class="tabbar" role="tablist" aria-label="World Cup Brand Tracker views">
  <div class="brand">
    <span class="dot"></span>
    <span class="wm">VOTT<span>World Cup Tracker</span></span>
  </div>
  <div class="tabs">
    <button class="tab" role="tab" id="tab-compare"  aria-selected="true"  aria-controls="panel-compare"  data-panel="compare">
      <span class="t-title"><span class="pip"></span>Compare yourself</span>
      <span class="t-sub">See how you compare to the public</span>
    </button>
    <button class="tab" role="tab" id="tab-explore"  aria-selected="false" aria-controls="panel-explore"  data-panel="explore">
      <span class="t-title"><span class="pip"></span>Explore the data</span>
      <span class="t-sub">Drill down into every question</span>
    </button>
    <button class="tab" role="tab" id="tab-insights" aria-selected="false" aria-controls="panel-insights" data-panel="insights">
      <span class="t-title"><span class="pip"></span>The insights</span>
      <span class="t-sub">Strategic takeaways &amp; trade vs public</span>
    </button>
  </div>
</nav>

<div class="stage">
  <div class="panel active" id="panel-compare"  role="tabpanel" aria-labelledby="tab-compare"  data-src="compare.html"></div>
  <div class="panel"        id="panel-explore"  role="tabpanel" aria-labelledby="tab-explore"  data-src="explore.html"></div>
  <div class="panel"        id="panel-insights" role="tabpanel" aria-labelledby="tab-insights" data-src="insights.html"></div>
</div>

<script>
(function(){
  var tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panels = {};
  document.querySelectorAll('.panel').forEach(function(p){ panels[p.id.replace('panel-','')] = p; });

  // Lazy-load each iframe the first time its tab is opened.
  function ensureLoaded(panel){
    if(panel.dataset.loaded) return;
    panel.dataset.loaded = '1';
    var loader = document.createElement('div');
    loader.className = 'loader';
    loader.innerHTML = '<span class="dot"></span>Loading';
    panel.appendChild(loader);
    var f = document.createElement('iframe');
    f.title = panel.getAttribute('aria-labelledby');
    f.loading = 'eager';
    f.addEventListener('load', function(){ loader.remove(); });
    f.src = panel.dataset.src;
    panel.appendChild(f);
  }

  function activate(name, focus){
    tabs.forEach(function(t){
      var on = t.dataset.panel === name;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if(on && focus) t.focus();
    });
    Object.keys(panels).forEach(function(k){
      panels[k].classList.toggle('active', k === name);
    });
    ensureLoaded(panels[name]);
    if(history.replaceState) history.replaceState(null, '', '#' + name);
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ activate(t.dataset.panel); });
  });

  // Left/Right arrow keyboard navigation across tabs.
  document.querySelector('.tabs').addEventListener('keydown', function(e){
    var i = tabs.findIndex(function(t){ return t.getAttribute('aria-selected') === 'true'; });
    if(e.key === 'ArrowRight'){ e.preventDefault(); activate(tabs[(i+1)%tabs.length].dataset.panel, true); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); activate(tabs[(i-1+tabs.length)%tabs.length].dataset.panel, true); }
  });

  // Deep-link support (#compare / #explore / #insights), default to first tab.
  var start = (location.hash || '').replace('#','');
  activate(panels[start] ? start : 'compare');
})();
</script>

</body>
</html>
