<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 World Cup Brand Tracker · Wave 1 — Voice of the Trade</title>
<style>
@font-face{font-family:"Rework Text";src:url("fonts/ReworkText-Light.woff2") format("woff2"),url("fonts/ReworkText-Light.woff") format("woff");font-weight:300 500;font-style:normal;font-display:swap;}
@font-face{font-family:"Rework Text";src:url("fonts/ReworkText-Bold.woff2") format("woff2"),url("fonts/ReworkText-Bold.woff") format("woff");font-weight:600 900;font-style:normal;font-display:swap;}
@font-face{font-family:"Rework Headline";src:url("fonts/ReworkText-Bold.woff2") format("woff2"),url("fonts/ReworkText-Bold.woff") format("woff");font-weight:600 900;font-style:normal;font-display:swap;}

:root{
  --pitch-dark:#0e3320;
  --chalk:#f1f4ec;
  --magenta:#d6006c;
  --cream:#f7e6c8;
  --card-edge:rgba(241,244,236,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Rework Text","Archivo","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--pitch-dark);color:var(--chalk);
  -webkit-font-smoothing:antialiased;
}

/* ---------- tab bar ---------- */
.tabbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:stretch;gap:0;
  background:rgba(8,32,20,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--card-edge);
  padding:0 16px;min-height:58px;
}
.brand{
  display:flex;align-items:center;gap:18px;padding:0 22px 0 4px;margin-right:6px;
  border-right:1px solid var(--card-edge);flex:none;
}
.brand a{display:inline-flex;align-items:center;border-bottom:0;line-height:0}
.brand img{width:auto;opacity:.95;display:block}
.brand img.potentia{height:24px}
.brand img.vott{height:34px}

.tabs{display:flex;align-items:stretch;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:none;color:var(--chalk);cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:8px 20px;white-space:nowrap;position:relative;
  font-family:inherit;text-align:left;transition:background .15s;
  border-bottom:3px solid transparent;
}
.tab:hover{background:rgba(255,255,255,.05)}
.tab .t-title{font-weight:600;font-size:14px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.tab .t-sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);opacity:.7}
.tab .pip{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.tab[aria-selected="true"]{border-bottom-color:var(--magenta);background:rgba(214,0,108,.12)}
.tab[aria-selected="true"] .t-title{color:#fff}
.tab[aria-selected="true"] .pip{background:var(--magenta);opacity:1;box-shadow:0 0 10px var(--magenta)}
.tab:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}

/* ---------- panels ---------- */
.stage{position:relative;background:var(--pitch-dark)}
.panel{display:none;position:relative}
.panel.active{display:block}
/* height is set per-panel from the height each tab reports (see script) */
.panel iframe{width:100%;height:600px;border:0;display:block;background:var(--pitch-dark)}
.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--cream);font-size:13px;letter-spacing:.16em;text-transform:uppercase;gap:12px;
}
.loader .dot{width:9px;height:9px;border-radius:50%;background:var(--magenta);
  box-shadow:0 0 12px var(--magenta);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

@media (max-width:680px){
  .brand{gap:12px;padding-right:14px}
  .brand img.potentia{height:20px}
  .brand img.vott{height:28px}
  .tab .t-sub{display:none}
  .tab{padding:10px 16px}
}
</style>
</head>
<body>

<nav class="tabbar" role="tablist" aria-label="World Cup Brand Tracker views">
  <div class="brand">
    <a href="https://potentia-sports.co.uk/" target="_blank" rel="noopener noreferrer"><img src="logo-potentia.png" alt="Potentia & Potentia Sports" class="potentia"></a>
    <a href="https://potentia-insight.co.uk/what-we-do/panels-community-expertise/voice-of-the-trade/" target="_blank" rel="noopener noreferrer"><img src="logo-vott.png" alt="Voice of the Trade" class="vott"></a>
  </div>
  <div class="tabs">
    <button class="tab" role="tab" id="tab-insights" aria-selected="true"  aria-controls="panel-insights" data-panel="insights">
      <span class="t-title"><span class="pip"></span>The insights</span>
      <span class="t-sub">Strategic takeaways &amp; trade vs public</span>
    </button>
    <button class="tab" role="tab" id="tab-explore"  aria-selected="false" aria-controls="panel-explore"  data-panel="explore">
      <span class="t-title"><span class="pip"></span>Explore the data</span>
      <span class="t-sub">Drill down into every question</span>
    </button>
    <button class="tab" role="tab" id="tab-compare"  aria-selected="false" aria-controls="panel-compare"  data-panel="compare">
      <span class="t-title"><span class="pip"></span>Compare yourself</span>
      <span class="t-sub">See how you compare to the public</span>
    </button>
  </div>
</nav>

<div class="stage">
  <div class="panel active" id="panel-insights" role="tabpanel" aria-labelledby="tab-insights" data-src="insights.html"></div>
  <div class="panel"        id="panel-explore"  role="tabpanel" aria-labelledby="tab-explore"  data-src="explore.html"></div>
  <div class="panel"        id="panel-compare"  role="tabpanel" aria-labelledby="tab-compare"  data-src="compare.html"></div>
</div>

<script>
(function(){
  var tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panels = {};
  document.querySelectorAll('.panel').forEach(function(p){ panels[p.id.replace('panel-','')] = p; });
  var heights = {}; // last content height reported by each tab

  // ---- Report our own height up to the embedding site (host page). ----
  // This is the snippet supplied by the web team, adapted to only post when the
  // height actually changes so the host <-> embed handshake can't loop forever.
  var lastSelf = -1, selfPending = false;
  function resizeMessage(){
    selfPending = false;
    var rect = document.documentElement.getBoundingClientRect();
    var h = Math.ceil(rect.height);
    if(h === lastSelf) return;
    lastSelf = h;
    try{ window.parent.postMessage({ type: "resize", rect: rect }, "*"); }catch(e){}
  }
  function reportUp(){ if(selfPending) return; selfPending = true; requestAnimationFrame(resizeMessage); }
  window.addEventListener("resize", function(){ reportUp(); setTimeout(reportUp, 1000); });
  new MutationObserver(reportUp).observe(document.body, { attributes:true, childList:true, subtree:true });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(reportUp);

  // ---- Receive messages from the tab iframes. ----
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d) return;

    // A tab asking the shell to switch to another tab (in-app links).
    if(d.type === 'wc-nav' && panels[d.panel]){ activate(d.panel); return; }

    // A tab reporting its content height -> size that tab's iframe to match.
    if(d.type === 'wc-embed-size' && typeof d.height === 'number'){
      var name = null;
      Object.keys(panels).forEach(function(k){
        var fr = panels[k].querySelector('iframe');
        if(fr && fr.contentWindow === e.source) name = k;
      });
      if(!name) return;
      heights[name] = d.height;
      var fr = panels[name].querySelector('iframe');
      if(fr) fr.style.height = d.height + 'px';
      reportUp();
    }
  });

  // Lazy-load each iframe the first time its tab is opened.
  function ensureLoaded(panel){
    if(panel.dataset.loaded) return;
    panel.dataset.loaded = '1';
    var loader = document.createElement('div');
    loader.className = 'loader';
    loader.innerHTML = '<span class="dot"></span>Loading';
    panel.appendChild(loader);
    var f = document.createElement('iframe');
    f.title = panel.getAttribute('aria-labelledby');
    f.loading = 'eager';
    f.scrolling = 'no'; // the iframe is sized to its content, so no inner scroll
    f.addEventListener('load', function(){ loader.remove(); });
    f.src = panel.dataset.src;
    panel.appendChild(f);
  }

  function activate(name, focus){
    tabs.forEach(function(t){
      var on = t.dataset.panel === name;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if(on && focus) t.focus();
    });
    Object.keys(panels).forEach(function(k){
      panels[k].classList.toggle('active', k === name);
    });
    ensureLoaded(panels[name]);
    // Restore the height this tab last reported so its panel opens at full size.
    var fr = panels[name].querySelector('iframe');
    if(fr && heights[name]) fr.style.height = heights[name] + 'px';
    reportUp();
    if(history.replaceState) history.replaceState(null, '', '#' + name);
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ activate(t.dataset.panel); });
  });

  // Left/Right arrow keyboard navigation across tabs.
  document.querySelector('.tabs').addEventListener('keydown', function(e){
    var i = tabs.findIndex(function(t){ return t.getAttribute('aria-selected') === 'true'; });
    if(e.key === 'ArrowRight'){ e.preventDefault(); activate(tabs[(i+1)%tabs.length].dataset.panel, true); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); activate(tabs[(i-1+tabs.length)%tabs.length].dataset.panel, true); }
  });

  // Deep-link support (#compare / #explore / #insights), default to first tab.
  var start = (location.hash || '').replace('#','');
  activate(panels[start] ? start : 'insights');
})();
</script>

</body>
</html>
